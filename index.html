<style>

<body>
<div id="app">

</div></div>

</div></div>
<div id="ov"><div class="card"><h2 id="ovT"></h2><p id="ovP"></p><div class="btns" id="ovB"></div></div></div>

<script>
'use strict';
/* GEN-START */
// ---------- level generator + solver (deterministic: level N is always the same puzzle) ----------
const MAX_LEVEL = 1000, HOOKS = 4, MAX_BANDS = 9;
const PALETTE = ['#ff4d6d', '#ffc300', '#3ddc84', '#3a86ff', '#b967ff', '#00d4e0', '#f4f4ff', '#ff7ad9'];
const INTRO = { chain: 25, lock: 50, twin: 100 };
function rng(seed) {
  let a = seed >>> 0;
  const r = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = n => r() * n | 0;
  r.range = (a, b) => a + r.int(b - a + 1);
  r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = r.int(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return r;
}
function params(L, r) {
  const kMax = L <= 2 ? L + 1 : Math.min(8, 4 + Math.floor(L / 55));
  const kMin = L <= 2 ? L + 1 : Math.max(3, Math.min(kMax, 3 + Math.floor(L / 90)));
  const k = r.range(kMin, kMax);
  const e = L < 15 ? 0 : r.range(0, Math.min(4, 1 + Math.floor(L / 120)));
  const T = 3 * (k + e);
  const avg = L < 10 ? 3 : 2.4 + r() * 1.4;
  let bands = Math.max(2, Math.min(MAX_BANDS, Math.round(T / avg)));
  const pick = (intro, max, step) => L < intro ? 0 : L === intro ? 1 : r.range(0, Math.min(max, 1 + Math.floor((L - intro) / step)));
  const twins = pick(INTRO.twin, 2, 150), chains = pick(INTRO.chain, 3, 120), locks = pick(INTRO.lock, 3, 120);
  return { k, e, bands, twins, chains, locks };
}
// a firing order that never fills the rack, as long as the fuses are lit in the right order
function safeOrder(counts, r) {
  for (let tries = 0; tries < 200; tries++) {
    const left = counts.slice(), held = counts.map(() => 0), seq = [];
    let ok = true;
    while (seq.length < counts.reduce((a, b) => a + b, 0)) {
      const opts = [];
      for (let c = 0; c < counts.length; c++) {
        if (!left[c]) continue;
        const h = (held[c] + 1) % 3, sum = held.reduce((a, b) => a + b, 0) - held[c] + h;
        if (sum < HOOKS) opts.push(c);
      }
      if (!opts.length) { ok = false; break; }
      const c = opts[r.int(opts.length)];
      seq.push(c); left[c]--; held[c] = (held[c] + 1) % 3;
    }
    if (ok) return seq;
  }
  return null;
}
// solver: units are things you can light (a twin pair is one unit). state = set of finished units.
// returns the chance that lighting random available units wins, plus whether any order wins.
function solve(lv) {
  const U = lv.units, m = U.length, full = (1 << m) - 1, K = lv.cols.length;
  const memo = new Float64Array(1 << m).fill(-1);
  const countsOf = mask => { const c = new Array(K).fill(0); for (let u = 0; u < m; u++) if (mask >> u & 1) for (const x of U[u].seq) c[x]++; return c; };
  function run(mask, u) { // light unit u from state mask; returns new mask or -1
    const cnt = countsOf(mask);
    while (true) {
      for (const x of U[u].seq) {
        cnt[x]++;
        let held = 0; for (let c = 0; c < K; c++) held += cnt[c] % 3;
        if (held >= lv.hooks) return -1;
      }
      mask |= 1 << u;
      const nx = U[u].next;
      if (nx < 0 || (mask >> nx & 1)) return mask;
      u = nx;
    }
  }
  function P(mask) {
    if (mask === full) return 1;
    if (memo[mask] >= 0) return memo[mask];
    const cnt = countsOf(mask); let n = 0, s = 0;
    for (let u = 0; u < m; u++) {
      if (mask >> u & 1) continue;
      if (U[u].lock >= 0 && cnt[U[u].lock] < 3) continue;
      n++; const nm = run(mask, u); if (nm >= 0) s += P(nm);
    }
    return memo[mask] = n ? s / n : 0;
  }
  return P(0);
}
function build(L, seed) {
  const r = rng(seed);
  const p = params(L, r);
  const colIdx = r.shuffle(PALETTE.map((_, i) => i)).slice(0, p.k);
  const counts = colIdx.map(() => 3);
  for (let i = 0; i < p.e; i++) counts[r.int(p.k)] += 3;
  const seq = safeOrder(counts, r);
  if (!seq) return null;
  // cut into chunks; twins need a chunk of 4+ that becomes two strands
  const nChunks = p.bands - p.twins;
  if (nChunks < 1 || seq.length < nChunks || seq.length > nChunks * 7) return null;
  const sizes = new Array(nChunks).fill(1);
  for (let extra = seq.length - nChunks; extra > 0;) { const i = r.int(nChunks); if (sizes[i] < 7) { sizes[i]++; extra--; } }
  let at = 0; const chunks = sizes.map(z => seq.slice(at, at += z)); // chunks[i] in solution order
  const kind = chunks.map(() => 'one'), next = chunks.map(() => -1), lock = chunks.map(() => -1);
  // twins
  const twinable = r.shuffle(chunks.map((c, i) => i).filter(i => chunks[i].length >= 4));
  if (twinable.length < p.twins) return null;
  twinable.slice(0, p.twins).forEach(i => kind[i] = 'twin');
  // chains: link chunk i -> i+1 (solution order), neither a twin
  const linkable = r.shuffle(chunks.map((c, i) => i).filter(i => i + 1 < chunks.length && kind[i] === 'one' && kind[i + 1] === 'one'));
  let madeChains = 0;
  for (const i of linkable) { if (madeChains >= p.chains) break; next[i] = i + 1; madeChains++; }
  if (madeChains < p.chains) return null;
  const isMember = chunks.map((c, i) => next.indexOf(i) >= 0);
  // locks: on a chunk that is not a chain member, by a colour that bursts earlier in the solution
  const cum = [], acc = new Array(p.k).fill(0);
  chunks.forEach((c, i) => { cum.push(acc.slice()); c.forEach(x => acc[x]++); });
  const lockable = r.shuffle(chunks.map((c, i) => i).filter(i => i > 0 && !isMember[i] && cum[i].some(v => v >= 3)));
  let madeLocks = 0;
  for (const i of lockable) {
    if (madeLocks >= p.locks) break;
    const opts = cum[i].map((v, c) => v >= 3 ? c : -1).filter(c => c >= 0);
    // prefer a colour that only just burst, so the lock really constrains
    opts.sort((a, b) => cum[i][a] - cum[i][b]);
    lock[i] = opts[r.int(Math.min(2, opts.length))]; madeLocks++;
  }
  if (madeLocks < p.locks) return null;
  // units for the solver, and strands for display
  const units = chunks.map((c, i) => ({ seq: c, next: next[i], lock: lock[i] }));
  const lv = { L, hooks: HOOKS, cols: colIdx.map(i => PALETTE[i]), units };
  // display groups: chains become runs of adjacent bands; twins two bands; others one
  const groups = [];

function padlock(color) {

  g.append(el('circle', { r: 15, class: 'ring', stroke: color }),
           el('path', { d: 'M-3.6 -1.5 V-4.5 A3.6 3.6 0 0 1 3.6 -4.5 V-1.5', fill: 'none', stroke: '#fff', 'stroke-width': 2.2 }),
           el('rect', { x: -5.5, y: -2, width: 11, height: 8.5, rx: 2, fill: '#fff' }));

}
function restart() {
  run++; rack = []; links = []; pending = 0; fired = 0; ended = false; hide(); svg.textContent = '';
  total = LV.strands.reduce((s, d) => s + d.rk.length, 0);
  const n = LV.strands.length, bandH = 400 / n, sc = Math.min(1, bandH / 52), amp = Math.min(10, bandH * .14);
  const layer = () => { const g = el('g', {}); svg.append(g); return g; };
  const gAsh = layer(), gFuse = layer(), gRock = layer(), gIgn = layer(), gSpark = layer();

    const s = { d, lit: false, done: false, prog: 0, pts: [], cum: [0], open: d.lock < 0 };
    const y0 = 10 + bandH * (i + .7), x0 = d.twin >= 0 ? 58 : 30;
    s.y0 = y0;
    for (let j = 0; j <= 60; j++) {
      const t = j / 60, xx = x0 + (330 - x0) * t;
      s.pts.push([d.dir ? 360 - xx : xx, y0 + Math.sin(t * 9.4 + d.phase) * amp]);

    }

    const path = 'M' + s.pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');

    s.fuse = el('path', { d: path, class: 'fuse', 'stroke-dasharray': s.len + ' ' + s.len }); gFuse.append(s.fuse);

      const color = LV.cols[c], [x, y] = pointAt(s, f * s.len);
      const g = el('g', { class: 'rocket', transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(3)})` });
      g.append(el('line', { x1: 0, y1: 0, x2: 0, y2: -9, class: 'stub' }),
               el('path', { d: 'M-6 -9 L-10 -5 L-6 -15 Z M6 -9 L10 -5 L6 -15 Z', fill: 'rgba(255,255,255,.8)' }),
               el('path', { d: 'M0 -36 C8 -29 8 -16 6 -9 H-6 C-8 -16 -8 -29 0 -36 Z', fill: color }),

    const inner = el('g', { class: 'ib' });
    inner.append(el('circle', { r: haloR, class: 'halo' }), el('circle', { r: 11, class: 'dot' }));
    if (!s.open) { s.lockColor = LV.cols[d.lock]; inner.append(padlock(s.lockColor)); }
    s.ign.append(inner);
    s.ign.addEventListener('pointerdown', e => { e.preventDefault(); light(s); });
    gIgn.append(s.ign);

}
function renderRack(popLast) {
  foot.textContent = '';
  for (let i = 0; i < HOOKS; i++) {
    const s = document.createElement('div'); s.className = 'slot';
    if (rack[i]) s.append(token(rack[i], popLast && i === rack.length - 1 ? 'in' : ''));
    foot.append(s);
  }
  foot.classList.toggle('warn', rack.length === HOOKS - 1);
}
function token(color, cls) { const t = document.createElement('div'); t.className = 'tok ' + cls; t.style.setProperty('--k', color); return t; }
function light(s, auto) {
  if (ended || paused || s.lit) return;
  audio();
  if (!s.open) { // still padlocked
    sfx.blocked(); buzz(30);
    const ib = s.ign.firstChild; ib.classList.remove('shake'); void ib.getBBox(); ib.classList.add('shake');
    return;
  }
  for (const t of s.partner ? [s, s.partner] : [s]) { t.lit = true; t.spark.classList.add('on'); }
  if (s.ign) s.ign.classList.add('lit');
  if (s.forks) s.forks.forEach(f => f.setAttribute('class', 'ash'));
  whoosh(.18, 3000, 6000, auto ? .18 : .3); tone(300, .12, { to: 900, type: 'triangle', v: .12 }); // match strike
}
function fire(r) {
  r.fired = true; fired++; r.g.classList.add('gone');
  tone(520, .32, { to: 2100, type: 'triangle', v: .13 }); whoosh(.3, 800, 4000, .14); // whistle
  const [x, y] = center(r.g), slot = foot.children[Math.min(rack.length + pending, HOOKS - 1)], [tx, ty] = center(slot);
  burst(x, y, '#ffd27a', 6);
  const t = token(r.color, 'fly'); t.style.left = x - 20 + 'px'; t.style.top = y - 20 + 'px'; document.body.append(t);
  pending++; const mine = run; // a restart mid-flight must not land this rocket in the new game
  t.animate([{ transform: 'translate(0,0) scale(.4)' },
             { transform: `translate(${(tx - x) * .4}px,${(ty - y) * .4 - 60}px) scale(1.2)`, offset: .5 },
             { transform: `translate(${tx - x}px,${ty - y}px) scale(1)` }],
            { duration: 380, easing: 'ease-in-out' }).onfinish = () => { t.remove(); if (mine !== run) return; pending--; land(r.color); };

function unlock(color) {
  for (const s of strands) {
    if (s.open || s.lockColor !== color) continue;
    s.open = true; s.ign.classList.remove('locked');
    const m = s.ign.querySelector('.lockmark'); if (m) m.remove();
    burst(...center(s.ign), color, 14);
    tone(880, .12, { type: 'triangle', v: .2, t: .25 }); tone(1320, .2, { type: 'triangle', v: .18, t: .33, echo: 1 });
  }
}
function land(color) {
  if (ended) return;
  rack.push(color); renderRack(true); sfx.pop(440 + rack.length * 70);
  if (rack.filter(c => c === color).length === 3) {
    [...foot.children].forEach((s, i) => { if (rack[i] === color) burst(...center(s), color, 16); });
    rack = rack.filter(c => c !== color);
    sfx.clear(); whoosh(.35, 300, 2500, .3); tone(110, .25, { to: 50, v: .4 }); // firework bang
    unlock(color);
    setTimeout(() => { if (!ended) renderRack(); }, 160);

// lose if nothing is burning or flying and every unlit spark is padlocked
function checkStuck() {

// the hiss of burning fuses: one looping noise source, faded in while anything burns

requestAnimationFrame(frame);
const game = { newLevel, restart };

/* ---------- level select ---------- */
let gridBuilt = false;
function openLevels() {
  const grid = $('grid');
  if (!gridBuilt) {
    gridBuilt = true;
    for (let t = 0; t < MAX_LEVEL / 100; t++) {
      const h = document.createElement('div'); h.className = 'tier';
      h.innerHTML = `<span>${TIERS[t]}</span><span>${t * 100 + 1}–${t * 100 + 100}</span>`;
      const cells = document.createElement('div'); cells.className = 'cells';
      for (let L = t * 100 + 1; L <= t * 100 + 100; L++) {

function closeLevels() { $('sel').classList.remove('show'); syncPause(); }
const syncPause = () => { paused = $('sel').classList.contains('show') || $('prof').classList.contains('show'); };

/* ---------- players panel ---------- */
let newColor = 0;
const initial = p => (p.name.trim()[0] || '?').toUpperCase();
function renderMe() {
  const b = $('me');
  if (me) { b.textContent = initial(me); b.style.setProperty('--k', PALETTE[me.color]); b.title = me.name + ' · switch player'; }
  else { b.textContent = '+'; b.style.removeProperty('--k'); b.title = 'Players'; }
}
function useProfile(p) {
  saveProfiles(); me = p; profiles.active = p.id; adopt(p); saveProfiles(); renderMe(); game.newLevel();
}
function removeProfile(p) {
  profiles.list = profiles.list.filter(q => q !== p);
  if (p === me) {

    if (profiles.list.length) useProfile(profiles.list[0]);

function openProfiles() {

function renderProfiles() {

  $('profSub').textContent = first ? 'Make a player to save your progress.' : 'Tap a player to switch.';
  $('profX').hidden = first;
